[project]
name = "kayan_kpi"
authors = [{ name = "Nest Software Development", email = "info@nsd-eg.com" }]
description = "KPI scorecards for Application and Sales Engineers on ERPNext and HRMS"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "B904", "W191", "E101", "F401", "F403", "F405", "E402", "RUF001", "RUF012"]

[tool.ruff.format]
quote-style = "double"
