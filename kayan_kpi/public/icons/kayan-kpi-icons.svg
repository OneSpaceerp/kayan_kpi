<!-- Dual-tone module icons for the desk dock and sidebar headers (Frappe v16), drawn to match the
     ERPNext and HRMS sprites: a 24 px grid, "-duotone" symbols filled from the duotone-light and
     duotone-dark variables for sidebar headers, "-soft" symbols in the shared soft-icon classes for the dock.

     The drawing follows the Kayan KPI logo: three result bars standing behind a gauge.
     This sprite is inserted into the page, so the style block below is a document stylesheet. -->

<svg id="kayan-kpi-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		.shell-header:hover .header-logo,
		.shell-header.hover .header-logo {
			--duotone-light: light-dark(var(--ink-gray-3), var(--ink-gray-4));
		}
		.dock-item--duotone.active {
			--duotone-light: var(--ink-gray-4);
			--duotone-dark: light-dark(var(--ink-gray-6), var(--ink-gray-7));
		}
		/* Kayan KPI: the needle swings up toward the target while the dock tile is hovered. */
		.kayan-kpi-needle {
			transform-box: view-box;
			transform-origin: 12px 19.5px;
			transform: rotate(calc(var(--icon-motion-opacity, 0) * 62deg));
			transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
		}
		/* Setup: the cog turns while hovered. */
		.kayan-kpi-setup-cog {
			transform-box: view-box;
			transform-origin: 17.5px 17.5px;
			animation: kayan-kpi-setup-turn 3s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes kayan-kpi-setup-turn {
			to { transform: rotate(360deg); }
		}
		@media (prefers-reduced-motion: reduce) {
			.kayan-kpi-needle { transition: none; transform: none; }
			.kayan-kpi-setup-cog { animation: none; }
		}
	</style>

	<!-- Kayan KPI: bars behind a gauge -->
	<symbol viewBox="0 0 24 24" id="icon-kayan-kpi-duotone" stroke="none" style="overflow: visible">
		<path d="M6.2 2.5H8.8V11.4H6.2ZM10.7 5.5H13.3V10.6H10.7ZM15.2 8H17.8V11.4H15.2Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M2.5 19.5A9.5 9.5 0 0 1 21.5 19.5H17.9A5.9 5.9 0 0 0 6.1 19.5Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<g class="kayan-kpi-needle">
			<path d="M11.2 19.3L8.1 14.3L12.8 18.4Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
		<circle cx="12" cy="19.5" r="1.9" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
	<symbol id="icon-kayan-kpi-soft" viewBox="0 0 24 24" class="soft-icon">
		<rect x="6.25" y="2.75" width="2.5" height="8.5" rx="0.5" class="soft-body"/>
		<rect x="10.75" y="5.75" width="2.5" height="5" rx="0.5" class="soft-body"/>
		<rect x="15.25" y="8.25" width="2.5" height="3" rx="0.5" class="soft-body"/>
		<path d="M6.25 11.25V3.25a.5.5 0 0 1 .5-.5h1.5a.5.5 0 0 1 .5.5v8M10.75 10.5V6.25a.5.5 0 0 1 .5-.5h1.5a.5.5 0 0 1 .5.5v4.25M15.25 11.25v-2.5a.5.5 0 0 1 .5-.5h1.5a.5.5 0 0 1 .5.5v2.5"/>
		<path d="M2.75 19.5a9.25 9.25 0 0 1 18.5 0h-3.4a5.85 5.85 0 0 0-11.7 0Z" class="soft-layer"/>
		<path d="M2.75 19.5a9.25 9.25 0 0 1 18.5 0h-3.4a5.85 5.85 0 0 0-11.7 0Z"/>
		<g class="kayan-kpi-needle">
			<path d="M12 19.5 8.6 14.8" class="soft-accent-line"/>
		</g>
		<circle cx="12" cy="19.5" r="1.6" class="soft-accent"/>
	</symbol>

	<!-- Kayan KPI Setup: the gauge with a cog -->
	<symbol viewBox="0 0 24 24" id="icon-kayan-kpi-setup-duotone" stroke="none" style="overflow: visible">
		<path d="M1.5 15.5A7.5 7.5 0 0 1 16.5 15.5H12.8A3.8 3.8 0 0 0 5.2 15.5Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M8.4 15.4L6.1 11.6L9.7 14.6Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="kayan-kpi-setup-cog">
			<path fill-rule="evenodd" d="M16.6 11.2H18.4L18.8 12.9L20.2 13.5L21.7 12.6L23 13.9L22.1 15.4L22.7 16.8L24.4 17.2V19L22.7 19.4L22.1 20.8L23 22.3L21.7 23.6L20.2 22.7L18.8 23.3L18.4 25H16.6L16.2 23.3L14.8 22.7L13.3 23.6L12 22.3L12.9 20.8L12.3 19.4L10.6 19V17.2L12.3 16.8L12.9 15.4L12 13.9L13.3 12.6L14.8 13.5L16.2 12.9ZM17.5 16.1A2 2 0 1 0 17.5 20.1A2 2 0 1 0 17.5 16.1Z" transform="translate(0 -0.6) scale(0.94) translate(1 1)" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
	</symbol>
	<symbol id="icon-kayan-kpi-setup-soft" viewBox="0 0 24 24" class="soft-icon">
		<path d="M1.75 15.5a7.25 7.25 0 0 1 14.5 0h-3.5a3.75 3.75 0 0 0-7.5 0Z" class="soft-layer"/>
		<path d="M1.75 15.5a7.25 7.25 0 0 1 14.5 0h-3.5a3.75 3.75 0 0 0-7.5 0Z"/>
		<path d="M9 15.5 6.6 12.2" class="soft-accent-line"/>
		<g class="kayan-kpi-setup-cog">
			<circle cx="17.5" cy="17.5" r="3.6" class="soft-accent"/>
			<path d="M17.5 12v1.4m0 8.2V23m5.5-5.5h-1.4m-8.2 0H12m9.39-3.89-1 1m-5.78 5.78-1 1m7.78 0-1-1m-5.78-5.78-1-1"/>
			<circle cx="17.5" cy="17.5" r="1.3"/>
		</g>
	</symbol>
</svg>
